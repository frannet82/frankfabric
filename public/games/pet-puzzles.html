<script>
/* Pet Puzzles sound engine - synthesised, no audio files, shared mute across both games */
var SND = (function(){
  "use strict";
  var KEY = 'petpuzzles.sound', ctx = null, master = null, enabled = null;

  function on(){
    if (enabled === null){
      try { enabled = localStorage.getItem(KEY) !== 'off'; } catch (e){ enabled = true; }
    }
    return enabled;
  }
  function setOn(v){
    enabled = !!v;
    try { localStorage.setItem(KEY, v ? 'on' : 'off'); } catch (e){}
  }
  try {
    window.addEventListener('storage', function(e){ if (e.key === KEY) enabled = e.newValue !== 'off'; });
  } catch (e){}

  function ac(){
    if (!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e){ return null; }
      master = ctx.createGain();
      master.gain.value = 0.20;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended'){ try { ctx.resume(); } catch (e){} }
    return ctx;
  }

  function tone(o){
    if (!on()) return;
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (o.d || 0), dur = o.dur || 0.12, v = o.v == null ? 0.6 : o.v;
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  function noise(o){
    if (!on()) return;
    var c = ac(); if (!c) return;
    var dur = o.dur || 0.08, t0 = c.currentTime + (o.d || 0);
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f || 900, t0);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f2), t0 + dur);
    f.Q.value = o.q || 1.1;
    var g = c.createGain();
    g.gain.setValueAtTime(o.v == null ? 0.25 : o.v, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  function seq(notes, step, opt){
    opt = opt || {};
    for (var i = 0; i < notes.length; i++){
      tone({ f: notes[i], type: opt.type || 'triangle', dur: opt.dur || 0.16,
             v: opt.v == null ? 0.5 : opt.v, d: i * step });
    }
  }

  var C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, D6 = 1174.7, G4 = 392;

  return {
    on: on, setOn: setOn, unlock: function(){ ac(); },

    tap:   function(){ tone({ f: 620, f2: 880, type: 'triangle', dur: 0.06, v: 0.34 }); },
    lift:  function(){ tone({ f: 500, f2: 760, type: 'triangle', dur: 0.07, v: 0.42 });
                       noise({ f: 2200, dur: 0.035, v: 0.10 }); },
    place: function(){ tone({ f: 300, f2: 190, type: 'triangle', dur: 0.10, v: 0.48 });
                       noise({ f: 800, f2: 300, dur: 0.05, v: 0.14 }); },
    deny:  function(){ tone({ f: 170, f2: 128, type: 'square', dur: 0.15, v: 0.22 }); },
    flip:  function(){ noise({ f: 500, f2: 3000, dur: 0.16, v: 0.16, q: 0.8 });
                       tone({ f: 700, f2: 1150, type: 'sine', dur: 0.12, v: 0.22, d: 0.05 }); },

    /* a line / set / tower finished */
    clear: function(n){
      var up = Math.pow(1.0595, Math.min(n || 0, 7) * 2);
      seq([C5 * up, E5 * up, G5 * up], 0.055, { dur: 0.20, v: 0.42 });
      noise({ f: 3200, dur: 0.20, v: 0.08, d: 0.02, q: 0.6 });
    },
    tower: function(){
      seq([C5, E5, G5, C6], 0.075, { dur: 0.30, v: 0.46 });
      tone({ f: G5, type: 'sine', dur: 0.5, v: 0.18, d: 0.3 });
      noise({ f: 2600, f2: 5200, dur: 0.4, v: 0.07, q: 0.5 });
    },
    win:   function(){
      seq([C5, E5, G5, C6, D6], 0.10, { dur: 0.38, v: 0.44 });
      tone({ f: C6, type: 'sine', dur: 0.8, v: 0.20, d: 0.42 });
    },
    lose:  function(){
      seq([G5, E5, C5, G4], 0.13, { type: 'sine', dur: 0.34, v: 0.30 });
    },
    ping:  function(){ tone({ f: 940, type: 'sine', dur: 0.12, v: 0.30 });
                       tone({ f: 1250, type: 'sine', dur: 0.14, v: 0.26, d: 0.09 }); },
    undo:  function(){ tone({ f: 620, f2: 400, type: 'triangle', dur: 0.13, v: 0.32 }); },
    shuffle: function(){ noise({ f: 400, f2: 2600, dur: 0.30, v: 0.15, q: 0.7 }); },
    button: function(){ tone({ f: 420, f2: 560, type: 'triangle', dur: 0.07, v: 0.30 }); }
  };
})();
<\/script>

<script>
(function(){
  "use strict";

  var TYPES = [
    {id:'tomato',      name:'Tomato',      face:'#FBD3C6', edge:'#E5A48D', ink:'#BC3F2A'},
    {id:'corn',        name:'Corn',        face:'#FCEBB8', edge:'#E5CB78', ink:'#9A7010'},
    {id:'cabbage',     name:'Cabbage',     face:'#D7EFD1', edge:'#A4D29A', ink:'#357840'},
    {id:'hedgehog',    name:'Hedgehog',    face:'#CFE2F7', edge:'#A0BFE4', ink:'#2C5A95'},
    {id:'grapes',      name:'Grapes',      face:'#E7DAF8', edge:'#BFABE5', ink:'#6A3CAD'},
    {id:'octopus',     name:'Octopus',     face:'#F8C9E4', edge:'#E099C9', ink:'#992F82'},
    {id:'eggplant',    name:'Eggplant',    face:'#D2D5F0', edge:'#A7ACDE', ink:'#3C3E8E'},
    {id:'dragonfruit', name:'Dragonfruit', face:'#FBDCE7', edge:'#E8AFC6', ink:'#A93764'}
  ];
  var BY_ID = {};
  TYPES.forEach(function(t){ BY_ID[t.id] = t; });

  var COLS = 7, CAP = 7, HOLD = 7;

  var els = {
    rack: document.getElementById('rack'),
    numbers: document.getElementById('numbers'),
    holdRow: document.getElementById('holdRow'),
    holdCount: document.getElementById('holdCount'),
    chips: document.getElementById('chips'),
    towerLabel: document.getElementById('towerLabel'),
    prog: document.getElementById('prog'),
    score: document.getElementById('score'),
    lv: document.getElementById('lv'),
    moves: document.getElementById('moves'),
    undo: document.getElementById('undo'),
    undoN: document.getElementById('undon'),
    hint: document.getElementById('hint'),
    hintN: document.getElementById('hintn'),
    snd: document.getElementById('snd'),
    restart: document.getElementById('restart'),
    overlay: document.getElementById('overlay'),
    card: document.getElementById('card'),
    wrap: document.querySelector('.rack-wrap'),
    app: document.querySelector('.app'),
    hud: document.querySelector('.hud'),
    hold: document.querySelector('.hold'),
    progWrap: document.querySelector('.prog-wrap'),
    controls: document.querySelector('.controls')
  };

  var S = null, uid = 0, carryScore = 0, history = [];
  var best = loadBest();

  /* ---------------- level generation ---------------- */

  function shuffleArr(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildLevel(n){
    var typeCount = Math.min(4 + Math.floor((n - 1) / 3), 6);
    var win = TYPES.slice(0, Math.min(typeCount + 2, TYPES.length));
    var pool = shuffleArr(win.slice()).slice(0, typeCount);

    var tiles = [], goals = {};
    pool.forEach(function(t){
      goals[t.id] = { type: t, done: false };
      for (var i = 0; i < CAP; i++) tiles.push({ id: ++uid, type: t.id, hidden: false });
    });
    shuffleArr(tiles);

    var maxPer = Math.ceil(tiles.length / COLS);
    var cols = [], i;
    for (i = 0; i < COLS; i++) cols.push({ tiles: [], done: false });
    var cursor = 0;
    tiles.forEach(function(tile){
      for (var k = 0; k < COLS; k++){
        var c = (cursor + k) % COLS;
        if (cols[c].tiles.length < maxPer){
          cols[c].tiles.push(tile);
          cursor = (c + 1) % COLS;
          return;
        }
      }
      cols[0].tiles.push(tile);
    });

    // a column that starts complete would be a free tower — break it up
    for (i = 0; i < COLS; i++){
      if (cols[i].tiles.length >= CAP && pureType(cols[i]) ){
        var o = (i + 1) % COLS;
        if (cols[o].tiles.length){
          var a = cols[i].tiles[0], b = cols[o].tiles[0];
          cols[i].tiles[0] = b; cols[o].tiles[0] = a;
        }
      }
    }

    // face-down tiles from level 4 on, never the exposed top of a column
    var hiddenCount = n >= 4 ? Math.min(2 + (n - 3) * 2, 12) : 0;
    if (hiddenCount){
      var candidates = [];
      for (i = 0; i < COLS; i++){
        for (var j = 0; j < cols[i].tiles.length - 1; j++) candidates.push(cols[i].tiles[j]);
      }
      shuffleArr(candidates);
      for (i = 0; i < hiddenCount && i < candidates.length; i++) candidates[i].hidden = true;
    }

    var hold = [];
    for (i = 0; i < HOLD; i++) hold.push(null);

    return {
      level: n, cap: CAP, cols: cols, hold: hold, goals: goals,
      towersTotal: typeCount, towersDone: 0,
      total: tiles.length, hiddenCount: hiddenCount,
      held: null, moves: 0, score: carryScore,
      undos: 5, hints: 3, won: false
    };
  }

  /* ---------------- board queries ---------------- */

  function pureType(col){
    var t = col.tiles;
    if (!t.length) return null;
    var ty = t[0].type;
    for (var i = 0; i < t.length; i++){
      if (t[i].hidden || t[i].type !== ty) return null;
    }
    return ty;
  }

  function canDropCol(c){
    if (S.held.src.kind === 'col' && S.held.src.idx === c) return false;
    var col = S.cols[c];
    if (col.done) return false;
    if (col.tiles.length >= S.cap) return false;
    if (!col.tiles.length) return true;
    var top = col.tiles[col.tiles.length - 1];
    return !top.hidden && top.type === S.held.tile.type;
  }

  function canDropHold(b){
    if (S.held.src.kind === 'hold' && S.held.src.idx === b) return false;
    if (S.hold[b] !== null) return false;
    return S.held.src.kind === 'col';
  }

  function revealTops(){
    var ids = [];
    for (var c = 0; c < COLS; c++){
      var t = S.cols[c].tiles;
      if (t.length && t[t.length - 1].hidden){
        t[t.length - 1].hidden = false;
        ids.push(t[t.length - 1].id);
      }
    }
    return ids;
  }

  function towerProgress(typeId){
    var n = 0;
    for (var c = 0; c < COLS; c++){
      if (pureType(S.cols[c]) === typeId) n = Math.max(n, S.cols[c].tiles.length);
    }
    return n;
  }

  /* ---------------- rendering ---------------- */

  function css(t){ return '--f:' + t.face + ';--e:' + t.edge + ';--k:' + t.ink; }
  function icon(id){ return '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#p-' + id + '"></use></svg>'; }

  function render(fx){
    fx = fx || {};
    var h = '', c, i;
    for (c = 0; c < COLS; c++){
      var col = S.cols[c];
      var heldHere = S.held && S.held.src.kind === 'col' && S.held.src.idx === c;
      var isTarget = S.held && canDropCol(c);
      var used = col.tiles.length + (heldHere ? 1 : 0) + (isTarget ? 1 : 0);
      var blanks = S.cap - used;
      var pure = !col.done && col.tiles.length && pureType(col) ? ' pure' : '';
      var cls = 'lane' + (col.done ? ' done' : pure) +
                (heldHere ? ' source' : '') + (isTarget ? ' target' : '');
      var label = col.done ? 'Column ' + (c + 1) + ', completed tower'
                : col.tiles.length ? 'Column ' + (c + 1) + ', ' + col.tiles.length + ' of ' + S.cap +
                    (col.tiles[col.tiles.length-1].hidden ? ', top tile face down' : ', top tile ' + BY_ID[col.tiles[col.tiles.length-1].type].name)
                : 'Column ' + (c + 1) + ', empty';

      h += '<button class="' + cls + '" data-col="' + c + '" aria-label="' + label + '">';
      if (col.done) h += '<span class="crown">Full</span>';

      for (i = 0; i < blanks; i++) h += '<div class="cell"></div>';
      if (isTarget) h += '<div class="ghost">' + icon(S.held.tile.type) + '</div>';
      if (heldHere) h += piece(S.held.tile, 'held');
      for (i = col.tiles.length - 1; i >= 0; i--){
        var extra = (i === col.tiles.length - 1 ? ' top' : '');
        if (fx.land === col.tiles[i].id) extra += ' landing';
        if (fx.flip && fx.flip.indexOf(col.tiles[i].id) > -1) extra += ' flip';
        if (fx.crown === c) extra += ' crowned';
        h += piece(col.tiles[i], extra);
      }
      h += '</button>';
    }
    els.rack.innerHTML = h;

    var nh = '';
    for (c = 0; c < COLS; c++) nh += '<span>' + (c + 1) + '</span>';
    els.numbers.innerHTML = nh;

    var bh = '', usedHold = 0, holdTarget = -1;
    if (S.held){
      for (i = 0; i < HOLD; i++) if (canDropHold(i)){ holdTarget = i; break; }
    }
    for (i = 0; i < HOLD; i++){
      var tile = S.hold[i];
      var lifted = S.held && S.held.src.kind === 'hold' && S.held.src.idx === i;
      var tgt = i === holdTarget;
      if (tile || lifted) usedHold++;
      var bcls = 'bslot' + (lifted ? ' source lifted' : '') + (tgt ? ' target' : '');
      var inner = '';
      if (lifted) inner = '<span class="face" style="' + css(BY_ID[S.held.tile.type]) + '">' + icon(S.held.tile.type) + '</span>';
      else if (tile) inner = '<span class="face" style="' + css(BY_ID[tile.type]) + '">' + icon(tile.type) + '</span>';
      else if (tgt) inner = '<span class="gh">' + icon(S.held.tile.type) + '</span>';
      bh += '<button class="' + bcls + '" data-buf="' + i + '" aria-label="Holding slot ' + (i + 1) +
            (tile ? ', ' + BY_ID[tile.type].name : ', empty') + '">' + inner + '</button>';
    }
    els.holdRow.innerHTML = bh;
    els.holdCount.textContent = usedHold + ' / ' + HOLD + ' used';
    els.holdCount.className = usedHold >= HOLD - 1 ? 'warn' : '';

    var ch = '';
    Object.keys(S.goals).forEach(function(k){
      var g = S.goals[k];
      ch += '<div class="chip' + (g.done ? ' done' : '') + '">' +
              '<div class="sq" style="' + css(g.type) + '">' + icon(g.type.id) + '</div>' +
              '<b>' + (g.done ? S.cap + '/' + S.cap : towerProgress(k) + '/' + S.cap) + '</b>' +
            '</div>';
    });
    els.chips.innerHTML = ch;
    els.towerLabel.textContent = 'Completed: ' + S.towersDone + '/' + S.towersTotal;
    els.prog.style.width = (S.towersDone / S.towersTotal) * 100 + '%';

    document.documentElement.style.setProperty('--cap', S.cap);
    fit();
    renderHud();
  }

  function piece(tile, extra){
    if (tile.hidden){
      return '<div class="pc hidden' + (extra || '') + '" data-id="' + tile.id + '">' +
             '<span class="face"><span class="qm">?</span></span></div>';
    }
    return '<div class="pc' + (extra || '') + '" data-id="' + tile.id + '" style="' + css(BY_ID[tile.type]) + '">' +
           '<span class="face">' + icon(tile.type) + '</span></div>';
  }

  function renderHud(){
    els.score.innerHTML = S.score.toLocaleString() + '<span>Score</span>';
    els.lv.textContent = S.level;
    els.moves.textContent = S.moves;
    els.undoN.textContent = S.undos;
    els.hintN.textContent = S.hints;
    els.undo.disabled = S.undos <= 0 || !history.length || S.won;
    els.hint.disabled = S.hints <= 0 || S.won;
  }

  function fit(){
    var w = els.rack.clientWidth;
    if (!w) return;
    var avail = els.app.clientHeight - 18 - 28
      - els.hud.offsetHeight - els.hold.offsetHeight
      - els.progWrap.offsetHeight - els.controls.offsetHeight
      - 17 - els.numbers.offsetHeight;
    var byW = (w - (COLS - 1) * 3) / COLS - 6;
    var byH = (avail - 9 - (S.cap - 1) * 2) / S.cap;
    var t = Math.floor(Math.min(byW, byH));
    document.documentElement.style.setProperty('--tile', Math.max(14, Math.min(54, t)) + 'px');
  }

  /* ---------------- play ---------------- */

  function snapshot(){
    history.push(JSON.stringify({
      cols: S.cols, hold: S.hold, goals: S.goals,
      towersDone: S.towersDone, score: S.score, moves: S.moves
    }));
    if (history.length > 40) history.shift();
  }

  function restore(){
    var raw = history.pop();
    if (!raw) return false;
    var d = JSON.parse(raw);
    S.cols = d.cols; S.hold = d.hold;
    S.towersDone = d.towersDone; S.score = d.score; S.moves = d.moves;
    Object.keys(d.goals).forEach(function(k){ S.goals[k].done = d.goals[k].done; });
    S.held = null;
    return true;
  }

  function clearSuggest(){
    var n = els.rack.querySelectorAll('.suggest');
    for (var i = 0; i < n.length; i++) n[i].classList.remove('suggest');
    n = els.holdRow.querySelectorAll('.suggest');
    for (i = 0; i < n.length; i++) n[i].classList.remove('suggest');
  }

  function deny(node){
    if (!node) return;
    SND.deny();
    node.classList.add('deny');
    setTimeout(function(){ node.classList.remove('deny'); }, 300);
  }

  function lift(kind, idx){
    if (kind === 'col'){
      var col = S.cols[idx];
      if (col.done || !col.tiles.length) return false;
      S.held = { src: { kind: 'col', idx: idx }, tile: col.tiles.pop() };
      SND.lift();
      return true;
    }
    if (S.hold[idx] === null) return false;
    S.held = { src: { kind: 'hold', idx: idx }, tile: S.hold[idx] };
    S.hold[idx] = null;
    SND.lift();
    return true;
  }

  function putBack(){
    if (!S.held) return;
    if (S.held.src.kind === 'col') S.cols[S.held.src.idx].tiles.push(S.held.tile);
    else S.hold[S.held.src.idx] = S.held.tile;
    S.held = null;
  }

  function tap(kind, idx, node){
    if (S.won) return;
    clearSuggest();

    if (!S.held){
      if (lift(kind, idx)) render();
      return;
    }
    if (S.held.src.kind === kind && S.held.src.idx === idx){
      putBack();
      render();
      return;
    }

    var ok = kind === 'col' ? canDropCol(idx) : canDropHold(idx);
    if (!ok){ deny(node); return; }

    var src = S.held.src, tile = S.held.tile;
    putBack();
    snapshot();
    // redo the lift, then place
    if (src.kind === 'col') S.cols[src.idx].tiles.pop();
    else S.hold[src.idx] = null;
    S.held = null;

    if (kind === 'col') S.cols[idx].tiles.push(tile);
    else S.hold[idx] = tile;
    S.moves++;
    SND.place();

    var flipped = revealTops();
    if (flipped.length) setTimeout(function(){ SND.flip(); }, 110);
    var crowned = -1;

    if (kind === 'col'){
      var col = S.cols[idx];
      if (col.tiles.length === S.cap && pureType(col)){
        col.done = true;
        crowned = idx;
        S.goals[col.tiles[0].type].done = true;
        S.towersDone++;
        S.score += 600;
      }
    }

    render({ land: tile.id, flip: flipped, crown: crowned });

    if (crowned > -1){
      SND.tower();
      toast('Tower complete');
      if (S.towersDone >= S.towersTotal){ finish(); return; }
    }
    if (!anyMove()) setTimeout(function(){ SND.lose(); showStuck(); }, 340);
  }

  function anyMove(){
    var i, j;
    // column top onto another column
    for (i = 0; i < COLS; i++){
      var col = S.cols[i];
      if (col.done || !col.tiles.length) continue;
      var t = col.tiles[col.tiles.length - 1];
      for (j = 0; j < COLS; j++){
        if (i === j) continue;
        var d = S.cols[j];
        if (d.done || d.tiles.length >= S.cap) continue;
        if (!d.tiles.length) return true;
        var dt = d.tiles[d.tiles.length - 1];
        if (!dt.hidden && dt.type === t.type) return true;
      }
      for (j = 0; j < HOLD; j++) if (S.hold[j] === null) return true;
    }
    // holding slot onto a column
    for (i = 0; i < HOLD; i++){
      if (!S.hold[i]) continue;
      for (j = 0; j < COLS; j++){
        var c2 = S.cols[j];
        if (c2.done || c2.tiles.length >= S.cap) continue;
        if (!c2.tiles.length) return true;
        var top2 = c2.tiles[c2.tiles.length - 1];
        if (!top2.hidden && top2.type === S.hold[i].type) return true;
      }
    }
    return false;
  }

  function finish(){
    S.won = true;
    var par = S.total;
    var stars = S.moves <= par * 1.1 ? 3 : S.moves <= par * 1.8 ? 2 : 1;
    var bonus = stars * 400 + S.undos * 120 + S.hints * 120;
    S.score += bonus;
    carryScore = S.score;
    saveBest();
    renderHud();
    setTimeout(function(){ SND.win(); showWin(stars, bonus); }, 520);
  }

  function toast(text){
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    els.wrap.appendChild(t);
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 1000);
  }

  /* ---------------- helpers ---------------- */

  function findMove(){
    var i, j, pick = null, bestScore = -1;
    function consider(score, move){ if (score > bestScore){ bestScore = score; pick = move; } }

    for (i = 0; i < COLS; i++){
      var col = S.cols[i];
      if (col.done || !col.tiles.length) continue;
      var t = col.tiles[col.tiles.length - 1];
      var srcPure = pureType(col);
      for (j = 0; j < COLS; j++){
        if (i === j) continue;
        var d = S.cols[j];
        if (d.done || d.tiles.length >= S.cap) continue;
        var dPure = pureType(d);
        if (d.tiles.length){
          var dt = d.tiles[d.tiles.length - 1];
          if (dt.hidden || dt.type !== t.type) continue;
          if (dPure === t.type && d.tiles.length === S.cap - 1) consider(100, { from:{kind:'col',idx:i}, to:{kind:'col',idx:j} });
          else if (dPure === t.type) consider(80 - (srcPure === t.type ? 40 : 0), { from:{kind:'col',idx:i}, to:{kind:'col',idx:j} });
          else consider(45, { from:{kind:'col',idx:i}, to:{kind:'col',idx:j} });
        } else if (!srcPure || col.tiles.length > 1){
          consider(30, { from:{kind:'col',idx:i}, to:{kind:'col',idx:j} });
        }
      }
    }
    for (i = 0; i < HOLD; i++){
      if (!S.hold[i]) continue;
      for (j = 0; j < COLS; j++){
        var c2 = S.cols[j];
        if (c2.done || c2.tiles.length >= S.cap) continue;
        if (c2.tiles.length){
          var top2 = c2.tiles[c2.tiles.length - 1];
          if (top2.hidden || top2.type !== S.hold[i].type) continue;
          consider(pureType(c2) === S.hold[i].type ? 95 : 50, { from:{kind:'hold',idx:i}, to:{kind:'col',idx:j} });
        } else consider(25, { from:{kind:'hold',idx:i}, to:{kind:'col',idx:j} });
      }
    }
    if (pick) return pick;
    // last resort: park a tile
    for (i = 0; i < COLS; i++){
      if (S.cols[i].done || !S.cols[i].tiles.length) continue;
      for (j = 0; j < HOLD; j++) if (S.hold[j] === null) return { from:{kind:'col',idx:i}, to:{kind:'hold',idx:j} };
    }
    return null;
  }

  function doHint(){
    if (S.hints <= 0 || S.won) return;
    if (S.held) putBack();
    var m = findMove();
    if (!m) return;
    S.hints--;
    SND.ping();
    lift(m.from.kind, m.from.idx);
    render();
    var node = m.to.kind === 'col'
      ? els.rack.querySelector('.lane[data-col="' + m.to.idx + '"]')
      : els.holdRow.querySelector('.bslot[data-buf="' + m.to.idx + '"]');
    if (node) node.classList.add('suggest');
  }

  function doUndo(){
    if (S.undos <= 0 || S.won || !history.length) return;
    S.undos--;
    SND.undo();
    restore();
    render();
  }

  /* ---------------- overlays ---------------- */

  function showOverlay(html){ els.card.innerHTML = html; els.overlay.hidden = false; }
  function hideOverlay(){ els.overlay.hidden = true; }

  function showIntro(){
    showOverlay(
      '<h2>Pet Tower Sort</h2>' +
      '<p>Seven columns, seven tiles each. Finish a column when all ' + CAP + ' of its tiles match.</p>' +
      '<ul class="rules">' +
        '<li>Tap a column to lift its <b>top</b> tile, then tap where it goes.</li>' +
        '<li>A tile only lands on an <b>empty column</b> or on a <b>matching tile</b>.</li>' +
        '<li>Seven <b>holding slots</b> sit below the board. Park a tile there when a column has nowhere to go — but a parked tile only comes back onto a match.</li>' +
        '<li>A column with nothing but one kind of tile gets a <b>gold rim</b>. Fill it to ' + CAP + ' and the tower is locked in.</li>' +
        '<li>From level 4, some tiles start <b>face down</b> and only flip when they reach the top of their column.</li>' +
      '</ul>' +
      '<div class="row"><button class="btn primary" data-act="start">Start level ' + S.level + '</button></div>' +
      (best.score ? '<p style="margin:14px 0 0;font-size:11.5px">Best: level ' + best.level + ' &middot; ' + best.score.toLocaleString() + ' pts</p>' : '')
    );
  }

  function showWin(stars, bonus){
    var s = '';
    for (var i = 0; i < 3; i++) s += i < stars ? '★' : '<i>★</i>';
    showOverlay(
      '<h2>All towers full</h2>' +
      '<div class="stars">' + s + '</div>' +
      '<p style="margin-top:10px">' + S.towersTotal + ' towers built in ' + S.moves + ' moves.</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + S.score.toLocaleString() + '</b><span>Score</span></div>' +
        '<div class="stat"><b>+' + bonus + '</b><span>Bonus</span></div>' +
        '<div class="stat"><b>' + S.moves + '</b><span>Moves</span></div>' +
      '</div>' +
      '<div class="row"><button class="btn primary" data-act="next">Level ' + (S.level + 1) + '</button></div>'
    );
  }

  function showStuck(){
    if (S.won) return;
    showOverlay(
      '<h2>No moves left</h2>' +
      '<p>Every holding slot is taken and nothing fits on a column. Step back a move or start the level again.</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + S.towersDone + '/' + S.towersTotal + '</b><span>Towers</span></div>' +
        '<div class="stat"><b>' + S.moves + '</b><span>Moves</span></div>' +
      '</div>' +
      '<div class="row">' +
        (S.undos > 0 && history.length ? '<button class="btn primary" data-act="undo">Undo last move</button>' : '') +
        '<button class="btn" data-act="retry">Restart level</button>' +
      '</div>'
    );
  }

  /* ---------------- storage ---------------- */

  function loadBest(){
    try {
      var raw = localStorage.getItem('towersort.v2');
      if (raw) return JSON.parse(raw);
    } catch (e){}
    return { score: 0, level: 0 };
  }
  function saveBest(){
    try {
      if (S && S.score > (best.score || 0)){ best.score = S.score; best.level = S.level; }
      localStorage.setItem('towersort.v2', JSON.stringify(best));
    } catch (e){}
  }

  /* ---------------- wiring ---------------- */

  function startLevel(n, keepScore){
    carryScore = keepScore && S ? S.score : 0;
    history = [];
    S = buildLevel(n);
    revealTops();
    render();
    hideOverlay();
  }


  function paintSnd(){
    if (!els.snd) return;
    els.snd.classList.toggle('off', !SND.on());
    els.snd.setAttribute('aria-pressed', SND.on() ? 'true' : 'false');
  }
  if (els.snd){
    els.snd.addEventListener('click', function(){
      SND.setOn(!SND.on());
      paintSnd();
      if (SND.on()) SND.ping();
    });
    paintSnd();
  }
  document.addEventListener('pointerdown', function unlockOnce(){
    SND.unlock();
    document.removeEventListener('pointerdown', unlockOnce);
  }, { once: true });

  els.rack.addEventListener('click', function(e){
    var lane = e.target.closest ? e.target.closest('.lane') : null;
    if (!lane) return;
    tap('col', parseInt(lane.getAttribute('data-col'), 10), lane);
  });
  els.holdRow.addEventListener('click', function(e){
    var slot = e.target.closest ? e.target.closest('.bslot') : null;
    if (!slot) return;
    tap('hold', parseInt(slot.getAttribute('data-buf'), 10), slot);
  });

  els.undo.addEventListener('click', doUndo);
  els.hint.addEventListener('click', doHint);
  els.restart.addEventListener('click', function(){ startLevel(S.level, false); });

  els.card.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    SND.button();
    var act = b.getAttribute('data-act');
    if (act === 'start') hideOverlay();
    else if (act === 'next') startLevel(S.level + 1, true);
    else if (act === 'retry') startLevel(S.level, false);
    else if (act === 'undo'){ hideOverlay(); doUndo(); }
  });

  document.addEventListener('keydown', function(e){
    if (!e.key || !els.overlay.hidden) return;
    if (e.key >= '1' && e.key <= '7'){
      var c = parseInt(e.key, 10) - 1;
      tap('col', c, els.rack.querySelector('.lane[data-col="' + c + '"]'));
    } else if (e.key === 'Escape' && S.held){ putBack(); render(); }
    else if (e.key.toLowerCase() === 'z') doUndo();
    else if (e.key.toLowerCase() === 'h') doHint();
  });

  window.addEventListener('resize', function(){ if (S) fit(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (S) fit(); });
  requestAnimationFrame(function(){ if (S) fit(); });

  function boot(data){
    startLevel((data && data.level) || 1, false);
    if (data && typeof data.score === 'number'){ S.score = data.score; renderHud(); }
    showIntro();
  }

  if (window.claude && window.claude.hot){
    try { window.claude.hot.snapshot(function(){ return S ? { level: S.level, score: S.score } : {}; }); } catch (e){}
    if (window.claude.hot.ready) window.claude.hot.ready(boot);
    else boot(window.claude.hot.data || {});
  } else {
    boot({});
  }
})();
<\/script>

<script>
(function(){
  "use strict";
  var GAMES = {
    jump: { title:'Pet Jump',       src:'src-jump', key:'petjump.v1',   lvl:'bestLevel', el:'best-jump' },
    sort: { title:'Pet Tower Sort', src:'src-sort', key:'towersort.v2', lvl:'level',     el:'best-sort' }
  };
  var home = document.getElementById('home');
  var stage = document.getElementById('stage');
  var frameBox = document.getElementById('frame');
  var stageTitle = document.getElementById('stageTitle');
  var sndBtn = document.getElementById('snd');
  var frames = {};
  var current = null;

  function readBest(key, lvlField){
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var d = JSON.parse(raw);
      var score = d.best != null ? d.best : d.score;
      if (!score) return null;
      return { score: score, level: d[lvlField] || 1 };
    } catch (e){ return null; }
  }

  function refreshBest(){
    Object.keys(GAMES).forEach(function(k){
      var g = GAMES[k], node = document.getElementById(g.el);
      if (!node) return;
      var b = readBest(g.key, g.lvl);
      node.textContent = b
        ? 'Best: level ' + b.level + ' · ' + b.score.toLocaleString() + ' pts'
        : 'No runs yet';
    });
  }

  function paintSnd(){
    if (!sndBtn) return;
    sndBtn.classList.toggle('off', !SND.on());
    sndBtn.setAttribute('aria-pressed', SND.on() ? 'true' : 'false');
  }

  function openGame(key){
    var g = GAMES[key];
    if (!g) return;
    SND.unlock();
    SND.button();
    if (!frames[key]){
      var doc = document.getElementById(g.src).textContent.split('<\\/script>').join('<' + '/script>');
      var f = document.createElement('iframe');
      f.title = g.title;
      f.srcdoc = doc;
      frameBox.appendChild(f);
      frames[key] = f;
    }
    Object.keys(frames).forEach(function(k){ frames[k].hidden = k !== key; });
    stageTitle.textContent = g.title;
    home.hidden = true;
    stage.hidden = false;
    current = key;
    try { frames[key].contentWindow.focus(); } catch (e){}
  }

  function back(){
    SND.button();
    stage.hidden = true;
    home.hidden = false;
    current = null;
    refreshBest();
  }

  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click', function(){ openGame(card.getAttribute('data-game')); });
  });
  document.getElementById('back').addEventListener('click', back);
  if (sndBtn){
    sndBtn.addEventListener('click', function(){
      SND.setOn(!SND.on());
      paintSnd();
      if (SND.on()) SND.ping();
    });
    paintSnd();
  }
  try {
    window.addEventListener('storage', function(e){ if (e.key === 'petpuzzles.sound') paintSnd(); });
  } catch (e){}
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && current) back(); });
  window.addEventListener('focus', refreshBest);

  refreshBest();
  setInterval(function(){ if (!current) refreshBest(); }, 2000);
})();
</script>

</body>
</html>
